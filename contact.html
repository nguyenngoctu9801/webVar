<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camnet - Contact</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/header.css" />
    <link rel="stylesheet" href="assets/css/footer.css" />
    <link rel="stylesheet" href="assets/css/contact.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>

    <!-- Hero + Contact Form chung background -->
    <section class="contact-hero">
      <h1 class="contact-hero__title" data-aos="fade-right">
        Kết Nối Với Camnet
      </h1>
      <p class="contact-hero__subtitle" data-aos="fade-up">
        Công nghệ chờ đợi bạn khám phá – ngay hôm nay
      </p>

      <!-- Contact Form -->
      <div class="contact-card" data-aos="fade-up">
        <form class="contact-form">
          <label for="name">Tên *</label>
          <input type="text" id="name" placeholder="Nhập tên..." required />

          <label for="phone">Điện thoại *</label>
          <input
            type="tel"
            id="phone"
            placeholder="Nhập số điện thoại..."
            required
          />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Nhập email (không bắt buộc)"
          />

          <label for="datetime">Ngày và giờ *</label>
          <input type="datetime-local" id="datetime" required />

          <button type="submit" class="contact-submit">Gửi</button>
        </form>
      </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/index.js"></script>
  </body>
</html>
